name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run public release content check
        run: python scripts/check_public_release.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run fixture evaluation
        run: |
          python -m prlearn eval \
            --fixture tests/fixtures/github_small.json \
            --incremental-fixture tests/fixtures/github_incremental.json \
            --json
