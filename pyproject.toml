[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "prlearn"
version = "0.1.0"
description = "Local-first CLI that turns GitHub PR feedback into personal coding learnings."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "prlearn" }]
dependencies = ["cryptography>=50.0.1"]

[project.optional-dependencies]
test = ["pytest>=9.0.3"]

[project.scripts]
prlearn = "prlearn.cli:main"

[tool.setuptools.packages.find]
include = ["prlearn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
